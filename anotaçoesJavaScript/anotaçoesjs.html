🔹 Operadores Aritméticos em JavaScript

Os operadores aritméticos são usados para realizar cálculos matemáticos em JavaScript. Eles permitem operações como soma, subtração, multiplicação, divisão e muito mais.

🔹 1. Operadores Básicos
✅ Adição (+) → Soma dois valores.
let resultado = 10 + 5;
console.log(resultado); // 15

✅ Subtração (-) → Subtrai um valor de outro.
let resultado = 10 - 5;
console.log(resultado); // 5

✅ Multiplicação (*) → Multiplica dois valores.
let resultado = 10 * 5;
console.log(resultado); // 50

✅ Divisão (/) → Divide um valor por outro.
let resultado = 10 / 5;
console.log(resultado); // 2

✅ Módulo (%) → Retorna o resto da divisão.
let resultado = 10 % 3;
console.log(resultado); // 1

✅ Exponenciação (**) → Calcula a potência de um número.
let resultado = 2 ** 3;
console.log(resultado); // 8

🔹 2. Operadores de Incremento e Decremento
✅ Incremento (++) → Aumenta o valor de uma variável em 1.
let numero = 5;
numero++;
console.log(numero); // 6

✅ Decremento (--) → Diminui o valor de uma variável em 1.
let numero = 5;
numero--;
console.log(numero); // 4

🔹 3. Ordem de Precedência
A ordem de execução dos operadores segue regras matemáticas: 1️⃣ Parênteses → () 2️⃣ Exponenciação → ** 3️⃣ Multiplicação e Divisão → * / % 4️⃣ Adição e Subtração → + -

✅ Exemplo de precedência:
let resultado = 10 + 5 * 2;
console.log(resultado); // 20 (Multiplicação ocorre primeiro)

✅ Usando parênteses para alterar a ordem:
let resultado = (10 + 5) * 2;
console.log(resultado); // 30 (Soma ocorre primeiro)

🔹 4. Aplicação Prática
✅ Calculando a média de três números:
let num1 = 8, num2 = 9, num3 = 10;
let media = (num1 + num2 + num3) / 3;
console.log(`A média é ${media}`);

✅ Verificando se um número é par ou ímpar:
let numero = 7;
if (numero % 2 === 0) {
    console.log("Número par");
} else {
    console.log("Número ímpar");
}

aula 8 – Operadores (Parte 2)
🔹 1. Operadores Relacionais
Os operadores relacionais são usados para comparar dois valores e retornam um resultado booleano (true ou false).

✅ Maior que (>) → Retorna true se o primeiro valor for maior que o segundo.
console.log(10 > 5); // true

✅ Menor que (<) → Retorna true se o primeiro valor for menor que o segundo.
console.log(10 < 5); // false

✅ Maior ou igual (>=) → Retorna true se o primeiro valor for maior ou igual ao segundo.
console.log(10 >= 10); // true

✅ Menor ou igual (<=) → Retorna true se o primeiro valor for menor ou igual ao segundo.
console.log(5 <= 10); // true

✅ Igual (==) → Compara valores, mas não verifica o tipo.
console.log(5 == "5"); // true (conversão automática)

✅ Diferente (!=) → Retorna true se os valores forem diferentes.
console.log(5 != "10"); // true

🔹 2. Operadores de Identidade (=== e !==)
Os operadores de identidade verificam valor e tipo, garantindo comparações mais precisas.

✅ Igualdade estrita (===) → Retorna true apenas se os valores e tipos forem iguais.
console.log(5 === "5"); // false (tipos diferentes)
console.log(5 === 5); // true

✅ Diferença estrita (!==) → Retorna true se os valores ou tipos forem diferentes.
console.log(5 !== "5"); // true
console.log(5 !== 5); // false

🔹 Dica: Sempre prefira === e !== para evitar problemas de conversão automática.

🔹 3. Operadores Lógicos
Os operadores lógicos combinam expressões booleanas para criar condições mais complexas.

✅ E lógico (&&) → Retorna true se ambas as condições forem verdadeiras.
console.log(true && false); // false
console.log(10 > 5 && 8 < 12); // true

✅ OU lógico (||) → Retorna true se pelo menos uma condição for verdadeira.
console.log(true || false); // true
console.log(10 > 5 || 8 > 12); // true

✅ Negação lógica (!) → Inverte o valor booleano.
console.log(!true); // false
console.log(!false); // true

🔹 4. Operador Ternário (? :)
O operador ternário é uma forma compacta de escrever condicionais if-else.

✅ Sintaxe:
condição ? valor_se_verdadeiro : valor_se_falso;

✅ Exemplo:
let idade = 18;
let mensagem = idade >= 18 ? "Maior de idade" : "Menor de idade";
console.log(mensagem); // "Maior de idade"

🔹 Dica: Use o operador ternário para simplificar verificações rápidas.

🔹 5. Ordem de Precedência dos Operadores
A ordem de execução dos operadores segue regras matemáticas:

1️⃣ Parênteses → () 2️⃣ Exponenciação → ** 3️⃣ Multiplicação, Divisão e Módulo → * / % 4️⃣ Adição e Subtração → + - 5️⃣ Operadores Relacionais → > < >= <= 6️⃣ Operadores de Igualdade → == != === !== 7️⃣ Operadores Lógicos → && || ! 8️⃣ Operador Ternário → ? :

✅ Exemplo de precedência:
let resultado = 10 + 5 * 2;
console.log(resultado); // 20 (Multiplicação ocorre primeiro)

✅ Usando parênteses para alterar a ordem:
let resultado = (10 + 5) * 2;
console.log(resultado); // 30 (Soma ocorre primeiro)

Aula 9 – Introdução ao DOM
[ex005dom.html] arquivo dos exercicios

O DOM é uma interface que permite ao JavaScript acessar e manipular elementos HTML e XML de uma página web. Ele representa a estrutura do documento como uma árvore de nós, onde cada elemento pode ser modificado dinamicamente.

🔹 1. O que é o DOM?
✅ O DOM é uma representação estruturada do documento HTML. ✅ Ele permite que JavaScript altere elementos, estilos e eventos da página. ✅ Cada elemento HTML é tratado como um objeto dentro do DOM.

🔹 Exemplo de estrutura DOM:

html
<html>
  <head>
    <title>Meu Site</title>
  </head>
  <body>
    <h1 id="titulo">Bem-vindo!</h1>
    <p class="texto">Este é um exemplo de DOM.</p>
  </body>
</html>
✅ O navegador transforma esse código em uma árvore DOM, onde cada elemento pode ser acessado e manipulado.

🔹 2. Árvore DOM – Estrutura Hierárquica
O DOM é organizado como uma árvore, onde cada elemento HTML é um nó.

✅ Estrutura básica:
- window
  |── document
      ├── html
          ├── head
          │   ├── title
          |
          ├── body
              ├── h1 (id="titulo")
              ├── p (class="texto")

✅ Elementos principais:
window → Representa a janela do navegador.

document → Representa o documento HTML.

html → Elemento raiz da página.

head e body → Contêm os elementos visíveis e metadados.

🔹 Cada elemento pode ter:
Pai (parent) → Elemento que contém outros elementos.

Filho (child) → Elementos dentro de outro elemento.

Irmão (sibling) → Elementos no mesmo nível.

🔹 3. Seletores DOM – Como acessar elementos?
O JavaScript oferece vários métodos para selecionar elementos do DOM:

✅ Por ID (getElementById)
Seleciona um elemento pelo seu ID único.
let titulo = document.getElementById("titulo");
titulo.style.color = "blue"; // Altera a cor do título

✅ Por Classe (getElementsByClassName)
Seleciona todos os elementos que possuem uma determinada classe.
let textos = document.getElementsByClassName("texto");
textos[0].style.fontSize = "20px"; // Altera o tamanho do primeiro elemento

✅ Por Nome (getElementsByName)
Seleciona elementos pelo atributo name.
let inputs = document.getElementsByName("usuario");
console.log(inputs.length); // Exibe quantos elementos possuem esse nome

✅ Por Tag (getElementsByTagName)
Seleciona todos os elementos de uma determinada tag.
let paragrafos = document.getElementsByTagName("p");
paragrafos[0].style.color = "red"; // Altera a cor do primeiro parágrafo

✅ Por Seletor (querySelector e querySelectorAll)
Seleciona elementos usando CSS selectors.
let titulo = document.querySelector("#titulo"); // Seleciona pelo ID
let textos = document.querySelectorAll(".texto"); // Seleciona todos os elementos com a classe "texto"

🔹 4. Manipulação do DOM – Alterando Elementos
✅ Modificando conteúdo (innerText e innerHTML)
document.getElementById("titulo").innerText = "Novo Título!";
document.getElementById("titulo").innerHTML = "<strong>Novo Título!</strong>";

✅ Alterando estilos (style)
document.getElementById("titulo").style.color = "green";

✅ Adicionando eventos (addEventListener)
document.getElementById("titulo").addEventListener("click", function() {
  alert("Título clicado!");
});

🔹 O que são eventos no DOM?
Eventos representam qualquer ação ou ocorrência que pode ser detectada no navegador. Exemplos incluem:

Um clique em um botão

A rolagem da página

A digitação em um campo de entrada

O DOM fornece métodos para capturar e executar ações quando esses eventos ocorrem.

🔹 Principais Tipos de Eventos
1️⃣ Eventos de Mouse
click → Quando o usuário clica em um elemento.

dblclick → Quando o usuário faz um clique duplo.

mouseover → Quando o mouse passa sobre um elemento.

mouseout → Quando o mouse sai de um elemento.

2️⃣ Eventos de Teclado
keydown → Quando uma tecla é pressionada.

keyup → Quando uma tecla é liberada.

keypress → Quando uma tecla é pressionada (obsoleto em alguns navegadores).

3️⃣ Eventos de Formulário
focus → Quando um campo recebe foco.

blur → Quando um campo perde o foco.

change → Quando o valor de um campo de entrada é alterado.

submit → Quando um formulário é enviado.

4️⃣ Eventos da Janela
load → Quando a página é totalmente carregada.

resize → Quando a janela do navegador é redimensionada.

scroll → Quando o usuário rola a página.

🔹 Como Capturar Eventos com JavaScript
A captura de eventos no DOM pode ser feita usando o método addEventListener(), que permite definir uma função de callback para ser executada quando o evento ocorre.

Exemplo: Capturar um clique em um botão
javascript
document.getElementById("meuBotao").addEventListener("click", function() {
    alert("Botão clicado!");
});
📌 Esse código adiciona um evento ao botão com id "meuBotao", que exibe um alerta quando o botão é clicado.

🔹 Event Object (event)
O objeto event permite acessar propriedades do evento ocorrido. Por exemplo:

document.addEventListener("keydown", function(event) {
    console.log("Tecla pressionada: " + event.key);
});
✅ Aqui, event.key retorna a tecla que foi pressionada.

🔹 Removendo Eventos
Caso seja necessário remover um evento, usa-se removeEventListener():

javascript
function minhaFuncao() {
    console.log("Evento ativado!");
}

document.getElementById("meuBotao").addEventListener("click", minhaFuncao);
document.getElementById("meuBotao").removeEventListener("click", minhaFuncao);
⚠️ O evento só pode ser removido se a função for referenciada pelo nome (não pode ser uma função anônima).

Módulo D: Condições em JavaScript

✅ Condições em JavaScript
Em programação, as condições são utilizadas para tomar decisões com base em determinados critérios. No JavaScript, temos quatro tipos principais de condições:

Simples (if)

Compostas (if...else)

Aninhadas (if...else if...else)

Múltiplas (switch)

1️⃣ Condições Simples (if)
A condição simples verifica uma única expressão lógica. Se a condição for verdadeira, o bloco de código dentro do if é executado.

Exemplo de Condição Simples
javascript
let idade = 18;

if (idade >= 18) {
    console.log("Você é maior de idade.");
}
💡 Detalhe: Se a variável idade for 18 ou maior, a mensagem "Você é maior de idade." será exibida.

2️⃣ Condições Compostas (if...else)
A condição composta permite tratar duas possibilidades:

Verdadeiro: Executa um bloco de código quando a condição é satisfeita.

Falso: Executa outro bloco de código quando a condição não é satisfeita.

Exemplo de Condição Composta
javascript
let idade = 16;

if (idade >= 18) {
    console.log("Você é maior de idade.");
} else {
    console.log("Você é menor de idade.");
}
💡 Detalhe: Se idade for inferior a 18, o código dentro do else é executado, mostrando "Você é menor de idade."

3️⃣ Condições Aninhadas (if...else if...else)
Utiliza-se condições aninhadas quando há várias verificações em sequência. O código testa uma condição após a outra até encontrar a correspondente verdadeira e, em seguida, executa o bloco associado.

Exemplo de Condição Aninhada
javascript
let nota = 85;

if (nota >= 90) {
    console.log("Parabéns, você tirou A!");
} else if (nota >= 80) {
    console.log("Bom trabalho, você tirou B!");
} else if (nota >= 70) {
    console.log("Você tirou C!");
} else {
    console.log("Você precisa estudar mais.");
}
💡 Detalhe:

Se a nota for 85, a segunda condição (nota >= 80) é satisfeita, exibindo "Bom trabalho, você tirou B!".

Cada teste é realizado sequencialmente até encontrar a condição correta.

4️⃣ Condições Múltiplas (switch)
O switch é ideal para situações com muitas opções específicas. Ele compara o valor de uma variável com diferentes casos (case) e executa o bloco de código correspondente.

Exemplo de Condição Múltipla
javascript
let dia = "terça";

switch (dia) {
    case "segunda":
        console.log("Hoje é segunda-feira.");
        break;
    case "terça":
        console.log("Hoje é terça-feira.");
        break;
    case "quarta":
        console.log("Hoje é quarta-feira.");
        break;
    default:
        console.log("Dia não reconhecido.");
}
