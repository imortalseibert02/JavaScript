<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>condicionais multiplas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif
            ;
            height: 96vh;
            text-align: center;
            background-image: linear-gradient(to bottom, green, darkgreen);
        }
        button{
            padding: 10px;
            color: white;
            background-color: black;
            font-weight: bold;
            letter-spacing: 2px;
        }
        button:hover{
            color: black;
            background-color: white;
            font-weight: bold;
        }
        h1{
            margin-bottom: 30px;
        }
        div.res{
            margin-bottom: 10px;
        }
        div.botoes{
            display: none;
        }
    </style>
</head>

<body>
    <h1>Alistamento militar </h1>
    <div class="res">
    </div>

    <div class="botoes">
        <button>Infantaria</button onclick="escolher()">
        <button>Cavalaria</button onclick="escolher()">
        <button>Artilharia</button onclick="escolher()">
        <button>Comunicações</button onclick="escolher()">
    </div>
</body>

</html>

  <script>
    var res = document.querySelector('.res')
    var botoes = document.querySelector('.botoes')
    var nome = window.prompt('Qual o seu nome ?')
    var idade = Number(window.prompt('Qual a sua idade ?'))
    var servir = window.prompt('Quer servir ao exército ?')

    if (servir.toLowerCase() == 'sim') {
        res.innerHTML = '<strong>Em qual arma deseja servir ?</strong>'
        botoes.style.display = 'block'

        var opcoes = botoes.querySelectorAll('button');
    opcoes.forEach(function(botao) {
        botao.addEventListener('click', function() {
            res.innerHTML = `<strong>Você escolheu: ${this.textContent}. Boa sorte, ${nome}!</strong>`;
            botoes.style.display = 'none';
        });
    });
    } 
    
    else {
        res.innerHTML = '<strong>Tenha um ótimo dia !</strong>'
        botoes.style.display = 'none'
    }


</script>
