<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>

<body>
    <h1>Sistema de Multas</h1>

    Velocidade do carro <input type="number" name="txtvel" id="txtvel"> Km/h

    <input type="button" value="Verificar" onclick="calcular()">

    <div id="res">

    </div>

    <script>
        function calcular() {
            var txtv = document.querySelector('#txtvel')
            var res = document.querySelector('#res')
            var vel = Number(txtv.value)
            res.innerHTML = `<p>Sua velocidade é de <strong>${vel}</strong> Km/h</p>`

            var multa = vel * 2

            if (vel > 60) {
                res.innerHTML += `<p><strong>MULTADO</strong> por estar acima da velocidade permitida.</p>`

                res.innerHTML += `<p> Tens de pagar ${multa} R$ para o governo.</p>`

            } else {
                res.innerHTML += '<p>Tenha uma boa viagem</p>'
            }
            res.innerHTML += 'Lembre-se de usar o cinto de segurança.'
        }


    </script>
</body>

</html>
